[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.cfg,*.json"
exclude_filter="export_presets.cfg"
export_path="../web/PaintedStar/index.html"
[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
